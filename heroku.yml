build:
  docker:
    web: Dockerfile

run:
  web:
    image: registry.heroku.com/bhealth-backend/web
    ports:
      - $PORT:$PORT
    depends_on:
      - db
    environment:
      PYTHONUNBUFFERED: 1
      DJANGO_SETTINGS_MODULE: src.config.local
    volumes:
      - staticfiles:/app/staticfiles
      - mediafiles:/app/mediafiles
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: database
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  staticfiles:
  mediafiles:
