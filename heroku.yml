build:
  docker:
    web: Dockerfile
run:
  web:
    image: registry.heroku.com/bhealth-backend/web
    ports:
      - $PORT:8000
    env:
      DB_NAME: database
      DB_USER: user
      DB_PASSWORD: password
      REDIS_URL: $REDIS_URL
      BROKER_URL: amqp://guest:guest@localhost:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379
    volumes:
      - /app/.:/app
    depends_on:
      - db
      - redis
  db:
    image: postgres:14.2
    env:
      POSTGRES_DB: database
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db-data:/var/lib/postgresql/data
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
volumes:
  db-data:
