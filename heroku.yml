build:
  docker:
    web: Dockerfile
run:
  image: registry.heroku.com/bhealth-backend/web
  env:
    DB_NAME: database
    DB_USER: user
    DB_PASSWORD: password
    REDIS_URL: $REDIS_URL
    BROKER_URL: amqp://guest:guest@localhost:5672//
    CELERY_RESULT_BACKEND: redis://redis:6379
  ports:
    - $PORT:8000
  depends_on:
    - db
    - redis
services:
  db:
    image: postgres:14.2
    env:
      POSTGRES_DB: database
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db-data:/var/lib/postgresql/data
  redis:
    image: redis:alpine
volumes:
  db-data:
